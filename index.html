<script>
"use strict";
/* =========================================================================
   ENGLISH GRAMMAR MASTERY — Units 53–58
   Single-file interactive grammar learning app
   ========================================================================= */

const APP_VERSION = "1.0.0";
const STORAGE_KEY = "grammar_mastery_53_58";

/* =========================================================================
   1. GRAMMAR UNITS — Units 53–58 (source-based grammar content)
   ========================================================================= */

const GRAMMAR_UNITS = [
{
  unit:53, title:"Verb + -ing", subtitle:"Động từ + V-ing",
  desc:"Các động từ theo sau bởi dạng -ing: enjoy, mind, suggest, stop, finish, recommend, avoid, admit, deny, give up, put off, keep on…",
  topics:[
    {
      id:"53.1", title:"enjoy / mind / fancy + V-ing",
      formula:"S + enjoy / mind / fancy + V-ing",
      en:"After enjoy, mind and fancy we use the -ing form, never the to-infinitive. Mind is mostly used in questions and negatives.",
      vi:"Sau enjoy, mind và fancy, ta dùng dạng V-ing, không bao giờ dùng to-infinitive. Mind thường dùng trong câu hỏi và câu phủ định.",
      correct:["I enjoy reading books.","Do you mind waiting a few minutes?","She fancies going to the cinema tonight."],
      incorrect:["I enjoy to read books.","Do you mind to wait?","She fancies to go to the cinema."],
      why:"These verbs are followed by a gerund (-ing), not an infinitive. Using 'to + verb' after them is a very common error.",
      mistakes:"❌ I enjoy to read. → ✅ I enjoy reading. · ❌ Would you mind to close the door? → ✅ Would you mind closing the door?",
      examples:["I really enjoy learning English grammar.","Do you mind opening the window? It's hot in here.","He doesn't fancy cooking tonight — let's eat out.","She enjoys working with children."]
    },
    {
      id:"53.2", title:"suggest / recommend / consider + V-ing",
      formula:"S + suggest / recommend / consider + V-ing",
      en:"Suggest, recommend and consider are followed by -ing. You can also use 'suggest that + subject + (should) + base verb' and 'recommend that …'. After suggest you cannot use 'to + infinitive' with a person.",
      vi:"Suggest, recommend và consider theo sau bởi V-ing. Ngoài ra có thể dùng cấu trúc 'suggest that + chủ ngữ + (should) + động từ nguyên thể' và 'recommend that …'. Sau suggest KHÔNG dùng 'suggest somebody to do something'.",
      correct:["She suggested going to the new café.","I recommend reading the book before the film.","We're considering moving to another city.","He suggested that we (should) take a break."],
      incorrect:["She suggested to go to the café.","He suggested me to take a break.","I recommend to read the book."],
      why:"Suggest / recommend / consider + -ing. Do not say 'suggest somebody to do something' — use a that-clause instead.",
      mistakes:"❌ She suggested me to leave. → ✅ She suggested that I (should) leave. / She suggested leaving.",
      examples:["The doctor recommended taking more exercise.","I suggest checking the answers again.","They are considering buying a flat in the city centre.","She recommended that we book early."]
    },
    {
      id:"53.3", title:"admit / deny / avoid / risk / imagine + V-ing",
      formula:"S + admit / deny / avoid / risk / imagine + V-ing",
      en:"Admit and deny can be followed by -ing or by a that-clause. Avoid, risk and imagine are followed by -ing.",
      vi:"Admit và deny có thể theo sau bởi V-ing hoặc mệnh đề that. Avoid, risk và imagine theo sau bởi V-ing.",
      correct:["He admitted taking the money.","She denied knowing anything about it.","You should avoid eating too much sugar.","Don't risk losing your scholarship.","I can't imagine living without the internet."],
      incorrect:["He admitted to take the money.","She denied to know about it.","You should avoid to eat sugar."],
      why:"These verbs take the gerund. After admit and deny you may also use 'having + past participle' for an earlier action.",
      mistakes:"❌ I avoid to drive at night. → ✅ I avoid driving at night.",
      examples:["He admitted having made a serious mistake.","She denied stealing the documents.","Try to avoid making the same mistake twice.","I imagine working abroad one day."]
    },
    {
      id:"53.4", title:"stop / finish / give up / put off + V-ing",
      formula:"S + stop / finish / give up / put off + V-ing",
      en:"Stop, finish, give up and put off are followed by -ing. Note: 'stop doing' = stop the activity; 'stop to do' = pause in order to do something else.",
      vi:"Stop, finish, give up và put off theo sau bởi V-ing. Lưu ý: 'stop doing' = dừng hẳn hoạt động; 'stop to do' = dừng lại để làm việc khác.",
      correct:["He stopped smoking two years ago.","Have you finished writing the report?","She gave up playing the piano.","They put off making a decision."],
      incorrect:["He stopped to smoke two years ago. (nghĩa khác)","Have you finished to write the report?","She gave up to play the piano."],
      why:"With these verbs the -ing form expresses the activity that is stopped, finished, abandoned or postponed. 'Stop to do' has a completely different meaning.",
      mistakes:"❌ I finished to read the book. → ✅ I finished reading the book.",
      examples:["We finished cleaning the flat at midnight.","He gave up trying to explain.","Don't put off doing your homework until Sunday.","She stopped working to have a baby."]
    },
    {
      id:"53.5", title:"go on / carry on / keep / keep on + V-ing",
      formula:"S + go on / carry on / keep / keep on + V-ing",
      en:"Go on, carry on, keep and keep on are followed by -ing when they mean 'continue'. 'Go on to do' means 'move on to do something different'.",
      vi:"Go on, carry on, keep và keep on theo sau bởi V-ing khi mang nghĩa 'tiếp tục'. 'Go on to do' nghĩa là 'chuyển sang làm việc khác'.",
      correct:["She went on talking for another hour.","Please carry on working.","He kept asking the same question.","They kept on laughing during the film."],
      incorrect:["She went on to talk for another hour. (nghĩa khác)","Please carry on to work.","He kept to ask the same question."],
      why:"When the meaning is 'continue the same activity', use -ing. Use 'go on to do' only when a new, different activity follows.",
      mistakes:"❌ He kept on to talk. → ✅ He kept on talking.",
      examples:["The teacher told us to carry on writing.","She kept on interrupting me.","After the break we went on to discuss Unit 54.","They carried on chatting until midnight."]
    },
    {
      id:"53.6", title:"verb + somebody + -ing",
      formula:"S + verb + somebody + V-ing",
      en:"Some verbs (remember, imagine, dislike, mind, catch, see, hear) can be followed by an object + -ing form. The -ing refers to an action that is happening or has happened.",
      vi:"Một số động từ (remember, imagine, dislike, mind, catch, see, hear) có thể theo sau bởi tân ngữ + V-ing. Dạng V-ing chỉ hành động đang diễn ra hoặc đã diễn ra.",
      correct:["I don't remember him saying that.","I can't imagine you living in the countryside.","I dislike people smoking near me.","We saw her leaving the building."],
      incorrect:["I don't remember him to say that.","I can't imagine you to live there."],
      why:"After these verbs we use object + -ing, not object + to-infinitive.",
      mistakes:"❌ I saw him to leave. → ✅ I saw him leaving.",
      examples:["I can't imagine her working as a nurse.","Do you remember us meeting at the conference?","He dislikes his colleagues arriving late.","I heard them arguing about money."]
    },
    {
      id:"53.7", title:"having done (perfect -ing)",
      formula:"S + verb + having + past participle",
      en:"The perfect -ing form (having done) is used when the first action is completed before the second one, or for an action in the past.",
      vi:"Dạng perfect -ing (having done) dùng khi hành động thứ nhất đã hoàn thành trước hành động thứ hai, hoặc cho hành động trong quá khứ.",
      correct:["Having finished the report, she went home.","He admitted having taken the money.","She denied having seen the document."],
      incorrect:["Having finish the report, she went home.","He admitted having take the money."],
      why:"Form: having + past participle. It replaces 'after + subject + had + past participle'.",
      mistakes:"❌ Having finished the report, she went to home. → ✅ Having finished the report, she went home.",
      examples:["Having studied all night, he felt exhausted.","She regretted having said those words.","Having lost his keys, he couldn't get in.","They denied having broken the window."]
    },
    {
      id:"53.8", title:"negative -ing forms",
      formula:"not + V-ing  /  never + V-ing",
      en:"To make a negative gerund, put not (or never) before the -ing form.",
      vi:"Để tạo dạng V-ing phủ định, đặt not (hoặc never) trước dạng V-ing.",
      correct:["He admitted not telling the truth.","I regret not studying harder.","She apologised for not coming to the party.","Try not to worry."],
      incorrect:["He admitted not to tell the truth.","I regret not to study harder.","She apologised for not come."],
      why:"The negative particle not comes immediately before the -ing form, never before the main verb of the gerund.",
      mistakes:"❌ I regret to not study. → ✅ I regret not studying.",
      examples:["She denied not having read the email.","I enjoy not having to get up early.","He was worried about not passing the exam.","Thank you for not smoking."]
    }
  ]
},
{
  unit:54, title:"Verb + to …", subtitle:"Động từ + to-infinitive",
  desc:"Các động từ theo sau bởi to-infinitive: offer, agree, refuse, decide, plan, hope, forget, manage, fail, promise, seem, appear, pretend, afford…",
  topics:[
    {
      id:"54.1", title:"offer, agree, refuse, decide, plan, arrange, hope",
      formula:"S + offer / agree / refuse / decide / plan / arrange / hope + to + V",
      en:"These verbs are followed by the to-infinitive. They express intention, willingness, refusal or arrangement.",
      vi:"Các động từ này theo sau bởi to-infinitive. Chúng diễn tả ý định, sự sẵn lòng, sự từ chối hoặc sự sắp xếp.",
      correct:["She offered to help me.","They agreed to postpone the meeting.","He refused to answer the question.","We've decided to move abroad.","I hope to see you soon."],
      incorrect:["She offered helping me.","They agreed postponing the meeting.","He refused answering the question."],
      why:"These verbs take the to-infinitive, not the -ing form.",
      mistakes:"❌ He refused answering. → ✅ He refused to answer.",
      examples:["They arranged to meet at six.","She plans to study medicine.","We hope to finish the project by June.","He agreed to lend me his car."]
    },
    {
      id:"54.2", title:"forget, manage, fail, promise, threaten",
      formula:"S + forget / manage / fail / promise / threaten + to + V",
      en:"These verbs are followed by the to-infinitive. Note that 'forget to do' means 'not remember to do something'.",
      vi:"Các động từ này theo sau bởi to-infinitive. Lưu ý 'forget to do' nghĩa là 'quên làm việc gì'.",
      correct:["Don't forget to lock the door.","She managed to finish on time.","He failed to arrive before midnight.","They promised to help us.","He threatened to call the police."],
      incorrect:["Don't forget locking the door.","She managed finishing on time.","They promised helping us."],
      why:"These verbs take the to-infinitive.",
      mistakes:"❌ He promised helping me. → ✅ He promised to help me.",
      examples:["I forgot to post the letter.","She managed to pass the exam.","They threatened to leave the company.","He failed to convince the committee."]
    },
    {
      id:"54.3", title:"deserve, afford, learn, tend",
      formula:"S + deserve / afford / learn / tend + to + V",
      en:"Deserve, afford, learn and tend are followed by the to-infinitive.",
      vi:"Deserve, afford, learn và tend theo sau bởi to-infinitive.",
      correct:["She deserves to get the prize.","We can't afford to buy a new car.","He learned to drive last year.","Prices tend to rise in summer."],
      incorrect:["She deserves getting the prize.","We can't afford buying a new car.","He learned driving last year."],
      why:"These verbs take the to-infinitive. 'Learn' can also take -ing when it means 'study a skill', but 'learn to do' is the standard pattern for acquiring a skill.",
      mistakes:"❌ I can't afford buying it. → ✅ I can't afford to buy it.",
      examples:["You deserve to be congratulated.","They can't afford to waste time.","She is learning to play the violin.","People tend to forget names."]
    },
    {
      id:"54.4", title:"negative infinitive: not to …",
      formula:"S + verb + not to + V",
      en:"To make a negative infinitive, put not before to.",
      vi:"Để tạo dạng to-infinitive phủ định, đặt not trước to.",
      correct:["She decided not to go.","He promised not to be late again.","Try not to worry about it.","They agreed not to tell anyone."],
      incorrect:["She decided to not go. (ít chuẩn)","He promised to not be late.","Try to not worry."],
      why:"The standard form is 'not to + verb'. 'To not + verb' is sometimes used in informal English but is not the standard pattern in examinations.",
      mistakes:"❌ I decided to not accept. → ✅ I decided not to accept.",
      examples:["He warned me not to touch the wire.","She chose not to reply.","We agreed not to discuss it again.","I'd prefer not to answer that question."]
    },
    {
      id:"54.5", title:"dare + infinitive with or without to",
      formula:"S + dare (to) + V  /  S + daren't + V",
      en:"Dare can be followed by the infinitive with or without to. In negatives and questions, dare often behaves like a modal verb (daren't, dare you…).",
      vi:"Dare có thể theo sau bởi to-infinitive hoặc động từ nguyên thể không có to. Trong câu phủ định và câu hỏi, dare thường hoạt động như động từ khuyết thiếu (daren't, dare you…).",
      correct:["She didn't dare (to) answer.","I daren't tell him the truth.","Dare you ask her?","He dared to criticise the manager."],
      incorrect:["She didn't dare answering.","I daren't to tell him."],
      why:"Dare takes a bare infinitive or a to-infinitive, never an -ing form. 'Daren't' is always followed by the bare infinitive.",
      mistakes:"❌ I don't dare telling her. → ✅ I don't dare (to) tell her.",
      examples:["Nobody dared to speak.","I daren't open the letter.","Dare I ask what happened?","She didn't dare look at him."]
    },
    {
      id:"54.6", title:"seem, appear, pretend and claim",
      formula:"S + seem / appear / pretend / claim + to + V",
      en:"These verbs are followed by the to-infinitive. They are often used to report impressions or claims.",
      vi:"Các động từ này theo sau bởi to-infinitive. Chúng thường dùng để diễn tả ấn tượng hoặc lời tuyên bố.",
      correct:["He seems to be tired.","She appears to know the answer.","He pretended to be asleep.","They claim to have found a solution."],
      incorrect:["He seems being tired.","She appears knowing the answer.","He pretended being asleep."],
      why:"These verbs take the to-infinitive. With seem and appear you can also use 'it seems that …'.",
      mistakes:"❌ She seems knowing everything. → ✅ She seems to know everything.",
      examples:["The situation appears to be improving.","He claims to have met the president.","She pretended not to hear me.","They seem to have forgotten our appointment."]
    },
    {
      id:"54.7", title:"continuous infinitive: to be doing",
      formula:"S + verb + to be + V-ing",
      en:"The continuous infinitive (to be doing) is used when the action is in progress, especially after seem, appear, pretend, happen.",
      vi:"Dạng continuous infinitive (to be doing) dùng khi hành động đang diễn ra, đặc biệt sau seem, appear, pretend, happen.",
      correct:["She seems to be working late.","He pretended to be reading.","They appear to be waiting for someone.","I happened to be passing by."],
      incorrect:["She seems to work late now. (nghĩa khác)","He pretended to read when I came in."],
      why:"Use 'to be + V-ing' for an action happening at the moment of speaking.",
      mistakes:"❌ He seems working hard. → ✅ He seems to be working hard.",
      examples:["The children seem to be enjoying themselves.","She appeared to be crying.","He pretended to be sleeping.","They happen to be staying in the same hotel."]
    },
    {
      id:"54.8", title:"perfect infinitive: to have done",
      formula:"S + verb + to have + past participle",
      en:"The perfect infinitive (to have done) refers to an action earlier than the main verb, or to something that did not happen as expected.",
      vi:"Dạng perfect infinitive (to have done) chỉ hành động xảy ra trước động từ chính, hoặc điều đáng lẽ đã xảy ra nhưng không xảy ra.",
      correct:["She seems to have forgotten the meeting.","He claimed to have finished the report.","I'm sorry to have kept you waiting.","You should have told me."],
      incorrect:["She seems to forget the meeting. (nghĩa khác)","He claimed to finish the report."],
      why:"Form: to have + past participle. It is common after seem, appear, claim, pretend and in polite apologies.",
      mistakes:"❌ She seems to forgot. → ✅ She seems to have forgotten.",
      examples:["They appear to have left already.","He pretended to have understood.","I was glad to have met her.","She is believed to have written the letter."]
    },
    {
      id:"54.9", title:"question word + to …",
      formula:"S + ask / know / decide / remember / forget / learn / explain / understand / wonder + what / how / where / when / whether + to + V",
      en:"After these verbs we can use a question word (what, how, where, when, whether, which) + to-infinitive.",
      vi:"Sau các động từ này ta có thể dùng từ để hỏi (what, how, where, when, whether, which) + to-infinitive.",
      correct:["I don't know what to do.","She asked how to get to the station.","We must decide whether to go or stay.","He explained how to use the machine."],
      incorrect:["I don't know what doing.","She asked how getting to the station.","We must decide whether going."],
      why:"Question word + to-infinitive is a very common structure. Do not use -ing after the question word in this pattern.",
      mistakes:"❌ I don't know how doing it. → ✅ I don't know how to do it.",
      examples:["Can you tell me where to find a chemist?","I wonder whether to accept the offer.","She forgot which button to press.","He knows how to deal with difficult customers."]
    },
    {
      id:"54.10", title:"show / tell / ask / advise / teach somebody what/how/where to do",
      formula:"S + show / tell / ask / advise / teach + somebody + question word + to + V",
      en:"These verbs can be followed by an object and a question word + to-infinitive.",
      vi:"Các động từ này có thể theo sau bởi tân ngữ và từ để hỏi + to-infinitive.",
      correct:["She showed me how to use the camera.","He told me where to wait.","They taught us how to write an essay.","The nurse advised him what to eat."],
      incorrect:["She showed me how using the camera.","He told me where waiting.","They taught us how writing an essay."],
      why:"Structure: verb + somebody + question word + to-infinitive.",
      mistakes:"❌ Can you show me how doing it? → ✅ Can you show me how to do it?",
      examples:["Could you tell me how to get to the airport?","She taught me how to drive.","He advised us which course to take.","They asked me where to put the boxes."]
    }
  ]

{
  unit:55, title:"Verb (+ object) + to …", subtitle:"Động từ (+ tân ngữ) + to-infinitive",
  desc:"want, expect, ask, help, tell, advise, remind, warn, invite, persuade, force, allow, make, let và cấu trúc bị động.",
  topics:[
    {
      id:"55.1", title:"want, expect, ask, help",
      formula:"S + want / expect / ask / help + somebody + to + V",
      en:"These verbs are followed by an object + to-infinitive. Help can also be followed by a bare infinitive (help somebody do).",
      vi:"Các động từ này theo sau bởi tân ngữ + to-infinitive. Help cũng có thể theo sau bởi động từ nguyên thể không to (help somebody do).",
      correct:["My parents want me to study medicine.","I expect them to arrive at six.","She asked me to help her.","He helped me (to) move the furniture."],
      incorrect:["My parents want that I study medicine.","She asked me helping her.","He helped me moving the furniture."],
      why:"Structure: verb + object + to-infinitive. 'Want that I…' is not English.",
      mistakes:"❌ She wants that I come. → ✅ She wants me to come.",
      examples:["We expect the results to be published soon.","They asked us to wait outside.","Can you help me to carry these boxes?","I want you to be more careful."]
    },
    {
      id:"55.2", title:"would like and would prefer",
      formula:"S + would like / would prefer + (somebody) + to + V",
      en:"Would like and would prefer are followed by the to-infinitive. With an object: would like somebody to do something.",
      vi:"Would like và would prefer theo sau bởi to-infinitive. Khi có tân ngữ: would like somebody to do something.",
      correct:["I'd like to book a table for two.","I'd like you to finish the report today.","She'd prefer to travel by train.","We'd prefer them to arrive earlier."],
      incorrect:["I'd like booking a table.","I'd like you finishing the report.","She'd prefer travelling by train. (khi nói về lựa chọn cụ thể)"],
      why:"With would like / would prefer we normally use the to-infinitive, not -ing.",
      mistakes:"❌ I'd like going home. → ✅ I'd like to go home.",
      examples:["Would you like to come with us?","I'd prefer to stay at home tonight.","She'd like her son to become a doctor.","They'd prefer us not to smoke here."]
    },
    {
      id:"55.3", title:"tell, advise, remind, warn, invite, encourage",
      formula:"S + tell / advise / remind / warn / invite / encourage + somebody + to + V",
      en:"These verbs are followed by an object + to-infinitive. For negatives use 'not to + verb'.",
      vi:"Các động từ này theo sau bởi tân ngữ + to-infinitive. Với câu phủ định dùng 'not to + động từ'.",
      correct:["She told me to wait outside.","The doctor advised me to rest.","He reminded me to lock the door.","They warned us not to swim there.","I invited her to join us.","The teacher encouraged us to ask questions."],
      incorrect:["She told me waiting outside.","The doctor advised me resting.","They warned us don't swim there."],
      why:"Structure: verb + object + (not) to-infinitive.",
      mistakes:"❌ He reminded me locking the door. → ✅ He reminded me to lock the door.",
      examples:["She advised him to see a specialist.","They invited us to stay for dinner.","He warned me not to be late.","My tutor encouraged me to apply for the scholarship."]
    },
    {
      id:"55.4", title:"persuade, get, force, teach, allow, enable",
      formula:"S + persuade / get / force / teach / allow / enable + somebody + to + V",
      en:"These verbs are followed by an object + to-infinitive. Get is more informal than persuade.",
      vi:"Các động từ này theo sau bởi tân ngữ + to-infinitive. Get thân mật hơn persuade.",
      correct:["She persuaded me to apply for the job.","He got his brother to help him.","They forced him to resign.","She taught me to swim.","My parents allowed me to go.","The grant enabled her to study abroad."],
      incorrect:["She persuaded me applying for the job.","They forced him resigning.","My parents allowed me going."],
      why:"All these verbs take object + to-infinitive. Note the difference between 'allow somebody to do' and 'let somebody do'.",
      mistakes:"❌ They forced him to resigning. → ✅ They forced him to resign.",
      examples:["I finally got my brother to lend me the car.","The noise forced us to close the windows.","His parents didn't allow him to stay out late.","This app enables students to study anywhere."]
    },
    {
      id:"55.5", title:"passive structures with these verbs",
      formula:"S + be + past participle + to + V",
      en:"Many of these verbs can be used in the passive: be told / asked / advised / allowed / expected / forced + to-infinitive.",
      vi:"Nhiều động từ trong số này có thể dùng ở dạng bị động: be told / asked / advised / allowed / expected / forced + to-infinitive.",
      correct:["I was told to wait outside.","She was asked to give a presentation.","We were advised to book early.","They were forced to cancel the trip."],
      incorrect:["I was told waiting outside.","She was asked giving a presentation."],
      why:"Passive: subject + be + past participle + to-infinitive.",
      mistakes:"❌ He was made doing it. → ✅ He was made to do it.",
      examples:["Students are expected to attend all lectures.","She was invited to speak at the conference.","We were allowed to leave early.","He was encouraged to try again."]
    },
    {
      id:"55.6", title:"suggest + that-clause",
      formula:"S + suggest + that + subject + (should) + V",
      en:"Suggest can be followed by a that-clause with should, or with the base form of the verb (subjunctive). It is NOT followed by 'somebody to do'.",
      vi:"Suggest có thể theo sau bởi mệnh đề that với should, hoặc với động từ nguyên thể (thức giả định). KHÔNG dùng 'suggest somebody to do'.",
      correct:["I suggest that we (should) take a break.","She suggested that he apply for the job.","They suggested that the meeting be postponed."],
      incorrect:["I suggest us to take a break.","She suggested him to apply for the job."],
      why:"After suggest, use a that-clause or the -ing form — never 'suggest somebody to do something'.",
      mistakes:"❌ He suggested me to leave. → ✅ He suggested that I (should) leave. / He suggested leaving.",
      examples:["The doctor suggested that she take more rest.","I suggest that we start again.","They suggested that the plan should be reviewed.","She suggested meeting earlier."]
    },
    {
      id:"55.7", title:"make somebody do / let somebody do",
      formula:"S + make / let + somebody + bare infinitive",
      en:"Make and let are followed by an object + the bare infinitive (no to).",
      vi:"Make và let theo sau bởi tân ngữ + động từ nguyên thể không to.",
      correct:["She made me wait for an hour.","He let me use his laptop.","They made us pay in advance.","Let me explain."],
      incorrect:["She made me to wait.","He let me to use his laptop.","They made us to pay."],
      why:"Make and let take the bare infinitive. Compare: allow somebody TO do something.",
      mistakes:"❌ My parents let me to go out. → ✅ My parents let me go out.",
      examples:["The film made me cry.","Don't let him drive — he's tired.","She made her son apologise.","Let me know if you need help."]
    },
    {
      id:"55.8", title:"passive: be made to do",
      formula:"S + be made + to + V",
      en:"In the passive, make is followed by the to-infinitive: be made to do something. Let has no passive form with 'to'; use 'be allowed to' instead.",
      vi:"Ở dạng bị động, make theo sau bởi to-infinitive: be made to do something. Let không có dạng bị động với 'to'; thay bằng 'be allowed to'.",
      correct:["He was made to apologise.","We were made to wait outside.","She was allowed to leave early."],
      incorrect:["He was made apologise.","She was let to leave early.","We were made waiting outside."],
      why:"Passive of make = be made TO do. Passive of let = be allowed TO do.",
      mistakes:"❌ The children were made doing their homework. → ✅ The children were made to do their homework.",
      examples:["They were made to work overtime.","I was made to feel welcome.","She was allowed to take the exam again.","We weren't allowed to use dictionaries."]
    }
  ]

{
  unit:56, title:"Verb + -ing or to … 1", subtitle:"Động từ + V-ing hoặc to-infinitive (1)",
  desc:"remember, regret, go on, begin, start, continue, intend, bother — sự khác biệt về nghĩa giữa V-ing và to-infinitive.",
  topics:[
    {
      id:"56.1", title:"remember doing / remember to do",
      formula:"remember + V-ing  (nhớ đã làm gì)  |  remember + to + V  (nhớ phải làm gì)",
      en:"Remember doing = you have a memory of a past action. Remember to do = you remember that you have to do something (and then you do it).",
      vi:"Remember doing = nhớ lại một hành động đã xảy ra trong quá khứ. Remember to do = nhớ rằng mình cần phải làm việc gì đó.",
      correct:["I remember locking the door. (Tôi nhớ là mình đã khoá cửa)","Please remember to lock the door. (Nhớ khoá cửa nhé)"],
      incorrect:["I remember to lock the door yesterday.","Please remember locking the door. (nghĩa khác)"],
      why:"V-ing refers backwards to a memory; to-infinitive refers forwards to a duty or future action.",
      mistakes:"❌ Remember locking the door before you go out. → ✅ Remember to lock the door before you go out.",
      examples:["I clearly remember meeting her at the party.","Remember to post my letter, please.","Do you remember seeing that film?","I must remember to buy milk on the way home."]
    },
    {
      id:"56.2", title:"regret doing / regret to do",
      formula:"regret + V-ing  (hối tiếc việc đã làm)  |  regret + to + V  (rất tiếc phải nói…)",
      en:"Regret doing = you are sorry about something you did in the past. Regret to do is used mainly with tell, say, inform, announce: 'I regret to tell you…'.",
      vi:"Regret doing = hối tiếc về việc đã làm trong quá khứ. Regret to do chủ yếu dùng với tell, say, inform, announce: 'I regret to tell you…'.",
      correct:["I regret saying that. (Tôi hối tiếc vì đã nói điều đó)","I regret to tell you that your application was unsuccessful."],
      incorrect:["I regret to say that yesterday.","I regret telling you that your application was unsuccessful."],
      why:"V-ing = past regret. To-infinitive = present bad news, used with reporting verbs.",
      mistakes:"❌ I regret to leave school so early. → ✅ I regret leaving school so early.",
      examples:["She regrets not studying harder.","We regret to inform you that the flight is delayed.","He regretted having lied to his parents.","I regret to say that we cannot help you."]
    },
    {
      id:"56.3", title:"go on doing / go on to do",
      formula:"go on + V-ing  (tiếp tục cùng một việc)  |  go on + to + V  (chuyển sang việc khác)",
      en:"Go on doing = continue the same activity. Go on to do = move on to do something different afterwards.",
      vi:"Go on doing = tiếp tục cùng một hoạt động. Go on to do = sau đó chuyển sang làm việc khác.",
      correct:["She went on talking for hours. (tiếp tục nói)","After university she went on to become a teacher. (sau đó trở thành giáo viên)"],
      incorrect:["She went on to talk for hours. (nghĩa khác)","After university she went on becoming a teacher."],
      why:"Choose -ing for continuation of the same action, to-infinitive for a subsequent, different stage.",
      mistakes:"❌ He went on to explain the same point. → ✅ He went on explaining the same point.",
      examples:["The band went on playing until midnight.","She went on to write three novels.","He went on working although he was ill.","After the introduction, she went on to discuss the results."]
    },
    {
      id:"56.4", title:"begin, start, continue, intend, bother",
      formula:"begin / start / continue / intend / bother + V-ing  OR  + to + V",
      en:"These verbs can be followed by either -ing or the to-infinitive with little or no difference in meaning. Avoid -ing after another -ing form where possible.",
      vi:"Các động từ này có thể theo sau bởi V-ing hoặc to-infinitive mà hầu như không khác nghĩa. Tránh dùng V-ing sau một V-ing khác.",
      correct:["It began raining. / It began to rain.","She continued working. / She continued to work.","I intend applying. / I intend to apply.","Don't bother waiting. / Don't bother to wait."],
      incorrect:["She continued to working.","I intend to applying."],
      why:"Both forms are correct. However, 'begin/start + V-ing' is avoided when the verb itself is in the -ing form (e.g. 'It's beginning to rain' rather than 'It's beginning raining').",
      mistakes:"❌ It's starting raining. → ✅ It's starting to rain.",
      examples:["The baby began crying. / The baby began to cry.","They continued to argue for an hour.","I don't intend changing my mind.","Don't bother to cook — we'll eat out."]
    },
    {
      id:"56.5", title:"verbs followed by -ing",

/* =========================================================================
   4. STATE & STORAGE
   ========================================================================= */

function defaultState(){
  return {
    version: APP_VERSION,
    itemStats: {},       // id -> {attempts, correct, wrong, seen, last}
    mistakes: [],        // mistake records
    history: [],         // session records
    studiedTopics: {},   // topicId -> true
    settings: { shuffle: true, timer: 30 },
    lastUnit: 53,
    lastTopicIdx: 0,
    sessions: 0,
    streak: { count:0, last:null }
  };
}

let state = defaultState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){ state = defaultState(); return; }
    const p = JSON.parse(raw);
    if(!p || typeof p !== "object" || Array.isArray(p)){ state = defaultState(); return; }
    const base = defaultState();
    state = {
      version: APP_VERSION,
      itemStats: (p.itemStats && typeof p.itemStats === "object") ? p.itemStats : {},
      mistakes: Array.isArray(p.mistakes) ? p.mistakes.filter(m => m && m.qid) : [],
      history: Array.isArray(p.history) ? p.history.filter(h => h && h.date) : [],
      studiedTopics: (p.studiedTopics && typeof p.studiedTopics === "object") ? p.studiedTopics : {},
      settings: Object.assign(base.settings, (p.settings && typeof p.settings === "object") ? p.settings : {}),
      lastUnit: typeof p.lastUnit === "number" ? p.lastUnit : 53,
      lastTopicIdx: typeof p.lastTopicIdx === "number" ? p.lastTopicIdx : 0,
      sessions: typeof p.sessions === "number" ? p.sessions : 0,
      streak: (p.streak && typeof p.streak === "object") ? p.streak : base.streak
    };
  }catch(e){
    console.warn("Storage corrupted; resetting.", e);
    state = defaultState();
  }
}

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn("Cannot save state", e); }
}

/* =========================================================================
   5. UTILITIES
   ========================================================================= */

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function shuffle(a){
  const arr = a.slice();
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function norm(s){
  return String(s == null ? "" : s)
    .toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/[.,!?;:"()\[\]{}\-–—]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}
function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  return String(Math.floor(sec/60)).padStart(2,"0") + ":" + String(sec%60).padStart(2,"0");
}
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._tm);
  t._tm = setTimeout(() => t.classList.remove("show"), 2300);
}
function getUnit(id){ return GRAMMAR_UNITS.find(u => u.unit === Number(id)); }
function findExercise(id){ return EX.find(e => e.id === id); }
function exercisesOfUnit(unit){ return EX.filter(e => e.unit === Number(unit)); }

/* =========================================================================
   6. PROGRESS HELPERS
   ========================================================================= */

function statsFor(id){
  return state.itemStats[id] || {attempts:0, correct:0, wrong:0, seen:0, last:null};
}
function touch(id, correct){
  const s = state.itemStats[id] || (state.itemStats[id] = {attempts:0, correct:0, wrong:0, seen:0, last:null});
  s.seen = (s.seen || 0) + 1;
  if(typeof correct === "boolean"){
    s.attempts = (s.attempts || 0) + 1;
    if(correct) s.correct = (s.correct || 0) + 1;
    else s.wrong = (s.wrong || 0) + 1;
  }
  s.last = Date.now();
  saveState();
}
function unitProgress(unitId){
  const u = getUnit(unitId);
  if(!u) return {percent:0, studied:0, totalTopics:0, accuracy:0, correct:0, wrong:0, attempts:0, exercises:0, doneEx:0};
  const totalTopics = u.topics.length;
  let studied = 0;
  u.topics.forEach(t => { if(state.studiedTopics[t.id]) studied++; });

  const exs = exercisesOfUnit(unitId);
  let correct = 0, wrong = 0, doneEx = 0;
  exs.forEach(e => {
    const s = statsFor(e.id);
    correct += s.correct || 0;
    wrong += s.wrong || 0;
    if((s.attempts || 0) > 0) doneEx++;
  });
  const attempts = correct + wrong;
  const topicPct = totalTopics ? Math.round(studied / totalTopics * 100) : 0;
  const exPct = exs.length ? Math.round(doneEx / exs.length * 100) : 0;
  return {
    percent: Math.round((topicPct * 0.4) + (exPct * 0.6)),
    studied, totalTopics,
    accuracy: attempts ? Math.round(correct / attempts * 100) : 0,
    correct, wrong, attempts,
    exercises: exs.length, doneEx
  };
}
function overallStats(){
  let correct = 0, wrong = 0;
  Object.keys(state.itemStats).forEach(id => {
    const s = state.itemStats[id];
    correct += s.correct || 0;
    wrong += s.wrong || 0;
  });
  const attempts = correct + wrong;
  let studiedTopics = 0, totalTopics = 0;
  GRAMMAR_UNITS.forEach(u => {
    totalTopics += u.topics.length;
    u.topics.forEach(t => { if(state.studiedTopics[t.id]) studiedTopics++; });
  });
  const doneEx = EX.filter(e => (statsFor(e.id).attempts || 0) > 0).length;
  return {
    correct, wrong, attempts,
    accuracy: attempts ? Math.round(correct / attempts * 100) : 0,
    studiedTopics, totalTopics,
    doneEx, totalEx: EX.length,
    unitsCompleted: GRAMMAR_UNITS.filter(u => {
      const p = unitProgress(u.unit);
      return p.studied === p.totalTopics && p.exercises > 0 && p.doneEx === p.exercises;
    }).length,
    sessions: state.sessions || 0,
    streak: (state.streak && state.streak.count) || 0
  };
}
function weakTopics(){
  const map = {};
  EX.forEach(e => {
    const s = statsFor(e.id);
    const att = (s.correct || 0) + (s.wrong || 0);
    if(att < 1) return;
    const key = e.topic;
    if(!map[key]) map[key] = {topic:key, unit:e.unit, correct:0, wrong:0, attempts:0};
    map[key].correct += s.correct || 0;
    map[key].wrong += s.wrong || 0;
    map[key].attempts += att;
  });
  return Object.values(map)
    .map(t => Object.assign(t, {accuracy: t.attempts ? Math.round(t.correct / t.attempts * 100) : 0}))
    .filter(t => t.accuracy < 75)
    .sort((a,b) => a.accuracy - b.accuracy)
    .slice(0, 8);
}

/* =========================================================================
   7. MISTAKES & SESSIONS
   ========================================================================= */

function recordMistake(ex, userAnswer, correctText){
  const now = Date.now();
  const existing = state.mistakes.find(m => m.qid === ex.id);
  if(existing){
    existing.userAnswer = userAnswer;
    existing.correctAnswer = correctText;
    existing.timestamp = now;
    existing.errors = (existing.errors || 1) + 1;
    existing.reviewed = false;
  } else {
    state.mistakes.unshift({
      qid: ex.id, unit: ex.unit, topic: ex.topic, type: ex.type,
      userAnswer, correctAnswer: correctText, timestamp: now,
      errors: 1, reviewed: false
    });
  }
  if(state.mistakes.length > 400) state.mistakes.length = 400;
  saveState();
}
function removeMistake(qid){
  state.mistakes = state.mistakes.filter(m => m.qid !== qid);
  saveState();
}
function registerSession(){
  const today = todayKey();
  const st = state.streak || (state.streak = {count:0, last:null});
  if(st.last === today) return;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const yKey = y.getFullYear() + "-" + String(y.getMonth()+1).padStart(2,"0") + "-" + String(y.getDate()).padStart(2,"0");
  st.count = (st.last === yKey) ? (st.count || 0) + 1 : 1;
  st.last = today;
  state.sessions = (state.sessions || 0) + 1;
  saveState();
}
function pushHistory(entry){
  state.history.unshift(entry);
  if(state.history.length > 100) state.history.length = 100;
  saveState();
}

];
const MOBILE_NAV = ["dashboard","units","practice","mistakes","progress"];

let currentView = "dashboard";
let viewParams = {};

function go(view, params){
  currentView = view;
  viewParams = params || {};

  const m = $("#view");
  if(m) m.focus({preventScroll:true});
}
function renderNav(){
  $("#sidebarNav").innerHTML = '<div class="navsec">Menu</div>' + NAV.map(n =>
    `<button class="navitem ${currentView===n.id?'active':''}" data-nav="${n.id}">
      <span class="ic">${n.ic}</span><span>${esc(n.label)}</span></button>`).join("");

  $("#mobileNav").innerHTML = MOBILE_NAV.map(id => {
    const n = NAV.find(x => x.id === id);
    return `<button class="mnav ${currentView===n.id?'active':''}" data-nav="${n.id}">
      <span class="ic">${n.ic}</span><span>${esc(n.label.split(" ")[0])}</span></button>`;
  }).join("");
}

/* =========================================================================
   9. MAIN RENDER
   ========================================================================= */

function render(){
  renderNav();
  const v = $("#view");
  let html = "";
  switch(currentView){
    case "dashboard": html = viewDashboard(); break;
    case "units":     html = viewUnits(); break;
    case "study":     html = viewStudy(); break;
    case "compare":   html = viewCompare(); break;
    case "practice":  html = viewPractice(); break;
    case "quiz":      html = viewQuiz(); break;
    case "mistakes":  html = viewMistakes(); break;
    case "progress":  html = viewProgress(); break;
    case "search":    html = viewSearch(); break;
    case "settings":  html = viewSettings(); break;
    default:          html = viewDashboard();
  }
  v.innerHTML = html;
  if(currentView === "quiz") afterQuizRender();
}

/* =========================================================================
   15. QUIZ ENGINE
   ========================================================================= */

let quiz = null;
let timerId = null;

function stopTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
}

function buildInstances(exs){
  return exs.map(e => {
    const inst = Object.assign({}, e);
    if((e.type === "mcq" || e.type === "contextual") && Array.isArray(e.options)){
      inst.shuffledOptions = state.settings.shuffle !== false ? shuffle(e.options) : e.options.slice();
    }
    if(e.type === "matching" && Array.isArray(e.pairs)){
      inst.rightOrder = shuffle(e.pairs.map(p => p.right));
      inst.leftOrder = shuffle(e.pairs.map(p => p.left));
    }
    return inst;
  });
}

function startQuiz(cfg){
  if(!cfg.questions || !cfg.questions.length){ toast("Không có câu hỏi nào."); return; }
  quiz = {
    title: cfg.title || "Practice",
    mode: cfg.mode || "practice",
    instances: buildInstances(shuffle(cfg.questions)),
    idx: 0,
    answers: {},
    checked: {},
    results: [],
    matchAssign: {},
    matchSel: null,
    startedAt: Date.now(),
    timed: !!cfg.timed,
    remaining: (cfg.minutes || state.settings.timer || 30) * 60,
    finished: false
  };
  registerSession();
  go("quiz");
}

function startUnitPractice(unit){
  startQuiz({title:"Unit " + unit + " — Practice", questions: exercisesOfUnit(unit), mode:"unit"});
}
function startTypePractice(type){
  startQuiz({title:"Practice — " + type, questions: EX.filter(e => e.type === type), mode:"type"});
}
function startTopicPractice(topicId){
  const qs = EX.filter(e => e.topic === topicId);
  if(!qs.length){ toast("Chủ điểm này chưa có bài tập riêng."); return; }
  startQuiz({title:"Practice — " + topicId, questions: qs, mode:"topic"});
}
function startMixed(){
  startQuiz({title:"Full Mixed Practice", questions: EX.slice(), mode:"mixed"});
}
function startRandom(){
  const sel = $("#randomCount");
  const n = sel ? parseInt(sel.value, 10) : randomCount;
  randomCount = isNaN(n) ? 20 : n;
  const count = Math.min(randomCount, EX.length);
  startQuiz({title:"Random Practice (" + count + " câu)", questions: shuffle(EX).slice(0, count), mode:"random"});
}
function startWeak(){
  const weak = weakTopics();
  let pool = [];
  if(weak.length){
    const topics = weak.map(w => w.topic);
    pool = EX.filter(e => topics.indexOf(e.topic) !== -1);
  }
  // add exercises with mistakes
  state.mistakes.forEach(m => {
    const e = findExercise(m.qid);
    if(e && pool.indexOf(e) === -1) pool.push(e);
  });
  if(!pool.length){ toast("Chưa đủ dữ liệu. Hãy làm vài bài tập trước."); return; }
  startQuiz({title:"Weak-area Practice", questions: shuffle(pool).slice(0, 25), mode:"weak"});
}
function startTimed(){
  const n = Math.min(40, EX.length);
  startQuiz({title:"Timed Test", questions: shuffle(EX).slice(0, n), mode:"timed", timed:true, minutes:30});
}
function startMistakePractice(qid){
  const e = findExercise(qid);
  if(!e){ toast("Không tìm thấy bài tập."); return; }
  startQuiz({title:"Retry mistake", questions:[e], mode:"retry"});
}

function afterQuizRender(){
  if(!quiz || quiz.finished) return;
  const q = quiz.instances[quiz.idx];
  if(!quiz.checked[quiz.idx] && ["fill","correction","transformation"].indexOf(q.type) !== -1){
    const inp = $("#textAnswer");
    if(inp) inp.focus();
  }
  startTimerIfNeeded();
}

function startTimerIfNeeded(){
  if(!quiz || !quiz.timed || quiz.finished || timerId) return;
  timerId = setInterval(() => {
    if(!quiz || quiz.finished){ stopTimer(); return; }
    quiz.remaining--;
    const box = $("#timerBox");
    if(box){
      box.textContent = fmtTime(quiz.remaining);
      box.classList.toggle("warn", quiz.remaining <= 300 && quiz.remaining > 60);
      box.classList.toggle("danger", quiz.remaining <= 60);
    }
    if(quiz.remaining === 300) toast("⏰ Còn 5 phút!");
    if(quiz.remaining === 60) toast("⏰ Còn 1 phút!");
    if(quiz.remaining <= 0){
      stopTimer();
      toast("⏰ Hết giờ — bài được nộp tự động.");
      finishQuiz();
    }
  }, 1000);
}

/* ---------- quiz view ---------- */

function viewQuiz(){
  if(!quiz) return `<div class="empty"><div class="big">🤔</div>
    <p>Chưa có bài luyện tập nào.</p>
    <button class="btn primary" data-nav="practice">Đến Practice Centre</button></div>`;
  if(quiz.finished) return viewQuizResult();

  const q = quiz.instances[quiz.idx];
  const total = quiz.instances.length;
  const checked = !!quiz.checked[quiz.idx];
  const res = quiz.results[quiz.idx];

  let body = "";
  if(q.type === "mcq" || q.type === "contextual"){
    if(q.type === "contextual" && q.situation){
      body += `<div class="situation"><strong>Tình huống:</strong> ${esc(q.situation)}</div>`;
    }
    const sel = quiz.answers[quiz.idx];
    body += (q.shuffledOptions || q.options).map((opt, i) => {
      let cls = "opt";
      if(checked){
        if(opt === q.answer) cls += " correct";
        else if(opt === sel) cls += " wrong";
      } else if(opt === sel) cls += " sel";
      const letter = String.fromCharCode(65 + i);
      let mark = "";
      if(checked){
        if(opt === q.answer) mark = '<span class="mark">✅</span>';
        else if(opt === sel) mark = '<span class="mark">❌</span>';
      }
      return `<button class="${cls}" data-opt="${esc(opt)}" ${checked?"disabled":""}>
        <span class="letter">${letter}</span><span>${esc(opt)}</span>${mark}</button>`;
    }).join("");
  } else if(q.type === "fill" || q.type === "correction" || q.type === "transformation"){
    const val = quiz.answers[quiz.idx] || "";
    const label = q.type === "fill"
      ? "Điền dạng đúng của động từ vào chỗ trống:"
      : q.type === "correction"
        ? "Viết lại câu đã sửa (chỉ nhập phần câu đã sửa):"
        : "Viết lại câu theo yêu cầu:";
    body = `<p class="small muted">${label}</p>
      <input class="inputline" id="textAnswer" type="text" value="${esc(val)}"
        placeholder="Nhập câu trả lời…" ${checked?"disabled":""} autocomplete="off" spellcheck="false">`;
  } else if(q.type === "matching"){
    const assigned = quiz.matchAssign[quiz.idx] || {};
    const sel = quiz.matchSel;
    const left = q.leftOrder || q.pairs.map(p => p.left);
    const right = q.rightOrder || q.pairs.map(p => p.right);
    body = `<p class="small muted">Nhấn vào một mục bên trái, sau đó nhấn vào mục tương ứng bên phải.</p>
      <div class="matchwrap">
        <div class="matchcol">
          ${left.map(l => {
            const a = assigned[l];
            let cls = "mitem";
            if(sel === l) cls += " sel";
            if(checked){
              const correctPair = q.pairs.find(p => p.left === l && p.right === a);
              cls = "mitem " + (correctPair ? "done" : "bad");
            } else if(a) cls += " matched";
            const expected = (q.pairs.find(p => p.left === l) || {}).right;
            return `<button class="${cls}" data-mleft="${esc(l)}" ${checked?"disabled":""}>
              <strong>${esc(l)}</strong>
              ${a ? `<span class="tagline">→ ${esc(a)}</span>` : ""}
              ${checked && !q.pairs.find(p => p.left === l && p.right === a)
                ? `<span class="tagline">Đúng: ${esc(expected)}</span>` : ""}
            </button>`;
          }).join("")}
        </div>
        <div class="matchcol">
          ${right.map(r => {
            let cls = "mitem";
            if(checked){
              const ok = Object.keys(assigned).some(l => assigned[l] === r && (q.pairs.find(p => p.left === l) || {}).right === r);
              cls = "mitem " + (ok ? "done" : "");
            } else if(Object.values(assigned).indexOf(r) !== -1){
              cls += " matched";
            }
            return `<button class="${cls}" data-mright="${esc(r)}" ${checked?"disabled":""}>${esc(r)}</button>`;
          }).join("")}
        </div>
      </div>`;
  }

  const progressPct = Math.round(quiz.idx / total * 100);

  return `
    <div class="row between" style="margin-bottom:10px">
      <div>
        <div class="tiny muted" style="font-weight:700;letter-spacing:.05em">${esc(quiz.title)}</div>
        <h1 style="margin:0">Câu ${quiz.idx+1} / ${total}</h1>
      </div>
      <div class="row">
        ${quiz.timed ? `<span class="timerbox" id="timerBox">${fmtTime(quiz.remaining)}</span>` : ""}
        <button class="btn small" data-quit-quiz="1">Thoát</button>
      </div>
    </div>
    <div class="bar"><span style="width:${progressPct}%"></span></div>

    <div class="card" style="margin-top:14px">
      <div class="qhead">
        <span class="pill blue">Unit ${q.unit}</span>
        <span class="pill">${esc(q.type)}</span>
        <span class="pill">${esc(q.difficulty || "B1")}</span>
        <span class="pill">${esc(q.topic || "")}</span>
      </div>
      <div class="qtext">${esc(q.question)}</div>
      ${body}

      ${checked ? renderFeedback(q, res) : ""}

      <hr>
      <div class="row between">
        <button class="btn" data-quiz-prev="1" ${quiz.idx===0?"disabled":""}>← Previous question</button>
        <div class="row">
          <button class="btn" data-quiz-restart="1">🔄 Restart</button>
          ${!checked
            ? `<button class="btn primary" data-quiz-check="1">Check answer</button>`
            : `<button class="btn primary" data-quiz-next="1">${quiz.idx === total-1 ? "Finish practice" : "Next question →"}</button>`}
        </div>
      </div>
    </div>
  `;
}

function renderFeedback(q, res){
  if(!res) return "";
  if(res.correct){
    return `<div class="feedback ok">
      <h4>✅ Correct — Chính xác!</h4>
      <div>${esc(res.explanation || q.explanation || "")}</div>
      <div class="small" style="margin-top:6px">${esc(res.viExplanation || q.viExplanation || "")}</div>
    </div>`;
  }
  let detail = "";
  if(q.type === "matching" && res.detail){
    detail = "<ul style='margin:8px 0 0;padding-left:18px'>" + res.detail.map(d =>
      `<li>${esc(d.left)} → <span class="${d.ok?'righttxt':'wrongtxt'}">${esc(d.got)}</span>${d.ok?"":" <span class='muted'>(đúng: "+esc(d.expected)+")</span>"}</li>`
    ).join("") + "</ul>";
  }
  return `<div class="feedback no">
    <h4>❌ Incorrect</h4>
    <div><strong>Đáp án đúng:</strong> <span class="righttxt">${esc(res.correctText)}</span></div>
    ${detail}
    <div style="margin-top:8px">${esc(res.explanation || q.explanation || "")}</div>
    <div class="small" style="margin-top:6px">${esc(res.viExplanation || q.viExplanation || "")}</div>
  </div>`;
}

/* ---------- answering ---------- */

function selectOption(val){
  if(!quiz || quiz.finished || quiz.checked[quiz.idx]) return;
  quiz.answers[quiz.idx] = val;
  render();
}
function selectLeft(left){
  if(!quiz || quiz.finished || quiz.checked[quiz.idx]) return;
  quiz.matchSel = (quiz.matchSel === left) ? null : left;
  render();
}
function selectRight(right){
  if(!quiz || quiz.finished || quiz.checked[quiz.idx]) return;
  if(!quiz.matchSel){ toast("Hãy chọn một mục bên trái trước."); return; }
  const assigned = quiz.matchAssign[quiz.idx] || (quiz.matchAssign[quiz.idx] = {});
  Object.keys(assigned).forEach(k => { if(assigned[k] === right) delete assigned[k]; });
  assigned[quiz.matchSel] = right;
  quiz.matchSel = null;
  render();
}

function checkCurrent(){
  if(!quiz || quiz.finished || quiz.checked[quiz.idx]) return;
  const i = quiz.idx;
  const q = quiz.instances[i];

  if(q.type === "matching"){
    const assigned = quiz.matchAssign[i] || {};
    if(q.pairs.some(p => !assigned[p.left])){ toast("Hãy nối hết các cặp trước khi kiểm tra."); return; }
    let allOk = true;
    const detail = [];
    q.pairs.forEach(p => {
      const got = assigned[p.left];
      const ok = got === p.right;
      if(!ok) allOk = false;
      detail.push({left:p.left, expected:p.right, got:got || "—", ok});
    });
    quiz.results[i] = {
      correct: allOk,
      correctText: q.pairs.map(p => p.left + " = " + p.right).join(" · "),
      explanation: q.explanation,
      viExplanation: q.viExplanation,
      detail
    };
    quiz.checked[i] = true;
    touch(q.id, allOk);
    if(!allOk) recordMistake(q, Object.keys(assigned).map(k => k + " = " + assigned[k]).join("; "), quiz.results[i].correctText);
    render();
    return;
  }

  if(q.type === "mcq" || q.type === "contextual"){
    const ans = quiz.answers[i];
    if(!ans){ toast("Hãy chọn một đáp án."); return; }
    const ok = ans === q.answer;
    quiz.results[i] = {correct:ok, correctText:q.answer, explanation:q.explanation, viExplanation:q.viExplanation};
    quiz.checked[i] = true;
    touch(q.id, ok);
    if(!ok) recordMistake(q, ans, q.answer);
    render();
    return;
  }

  // fill / correction / transformation
  const raw = quiz.answers[i];
  if(!raw || !String(raw).trim()){ toast("Hãy nhập câu trả lời của bạn."); return; }
  const accepted = q.acceptedAnswers || [];
  const ok = accepted.some(a => norm(a) === norm(raw));
  quiz.results[i] = {correct:ok, correctText:accepted[0] || "", explanation:q.explanation, viExplanation:q.viExplanation};
  quiz.checked[i] = true;
  touch(q.id, ok);
  if(!ok) recordMistake(q, String(raw), accepted[0] || "");
  render();
}

function nextQuestion(){
  if(!quiz) return;
  if(quiz.idx >= quiz.instances.length - 1){ finishQuiz(); return; }
  quiz.idx++;
  quiz.matchSel = null;
  render();
}
function prevQuestion(){
  if(!quiz || quiz.idx === 0) return;
  quiz.idx--;
  quiz.matchSel = null;
  render();
}
function restartQuiz(){
  if(!quiz) return;
  if(!confirm("Bạn có chắc muốn làm lại bài này từ đầu?")) return;
  const exs = quiz.instances.map(i => findExercise(i.id)).filter(Boolean);
  startQuiz({title: quiz.title, questions: exs, mode: quiz.mode, timed: quiz.timed, minutes: state.settings.timer});
}

function finishQuiz(){
  if(!quiz || quiz.finished) return;
  stopTimer();
  quiz.finished = true;
  const total = quiz.instances.length;
  let correct = 0, incorrect = 0, unanswered = 0;
  quiz.instances.forEach((q, i) => {
    const r = quiz.results[i];
    if(!r){ unanswered++; return; }
    if(r.correct) correct++; else incorrect++;
  });
  quiz.score = {total, correct, incorrect, unanswered};
  quiz.durationSec = Math.round((Date.now() - quiz.startedAt) / 1000);

  pushHistory({
    date: Date.now(), title: quiz.title, mode: quiz.mode,
    total, correct, incorrect, unanswered, duration: quiz.durationSec
  });
  render();
}

function viewQuizResult(){
  const s = quiz.score;
  const pct = s.total ? Math.round(s.correct / s.total * 100) : 0;

  const byUnit = {};
  quiz.instances.forEach((q, i) => {
    const k = "Unit " + q.unit;
    if(!byUnit[k]) byUnit[k] = {total:0, correct:0};
    byUnit[k].total++;
    if(quiz.results[i] && quiz.results[i].correct) byUnit[k].correct++;
  });
  const rows = Object.keys(byUnit).sort().map(k => {
    const v = byUnit[k];
    const p = v.total ? Math.round(v.correct / v.total * 100) : 0;
    return `<tr><td>${esc(k)}</td><td>${v.correct} / ${v.total}</td><td>${p}%</td>
      <td><div class="bar" style="margin:0;min-width:90px"><span style="width:${p}%"></span></div></td></tr>`;
  }).join("");

  const review = quiz.instances.map((q, i) => {
    const r = quiz.results[i];
    const ok = r && r.correct;
    let userAns = "(chưa trả lời)";
    if(q.type === "matching"){
      const a = quiz.matchAssign[i];
      if(a) userAns = Object.keys(a).map(k => k + " = " + a[k]).join("; ");
    } else if(quiz.answers[i] !== undefined){
      userAns = quiz.answers[i];
    }
    return `<div class="list-item" style="${ok?'':'border-color:#f6cfcd;background:#fffafa'}">
      <div class="q">${ok?"✅":"❌"} ${esc(q.question)}</div>
      <div class="ansline"><span class="lbl">Bạn trả lời:</span> <span class="${ok?'righttxt':'wrongtxt'}">${esc(userAns)}</span></div>
      ${ok?"":`<div class="ansline"><span class="lbl">Đáp án đúng:</span> <span class="righttxt">${esc(r ? r.correctText : "")}</span></div>`}
      <div class="ansline"><span class="lbl">Giải thích:</span> ${esc(q.explanation || "")}</div>
      <div class="ansline small muted">${esc(q.viExplanation || "")}</div>
      <div class="ansline tiny muted">Unit ${q.unit} · ${esc(q.topic || "")} · ${esc(q.type)}</div>
    </div>`;
  }).join("");

  return `
    <div class="card pad-lg">
      <h1>Practice complete 🎉</h1>
      <p class="muted">${esc(quiz.title)}</p>
      <div class="grid g4" style="margin:14px 0">
        <div class="stat"><div class="k">Score</div><div class="v">${s.correct} / ${s.total}</div><div class="sub">${pct}%</div></div>
        <div class="stat"><div class="k">Correct</div><div class="v" style="color:var(--green)">${s.correct}</div></div>
        <div class="stat"><div class="k">Incorrect</div><div class="v" style="color:var(--red)">${s.incorrect}</div></div>
        <div class="stat"><div class="k">Unanswered</div><div class="v">${s.unanswered}</div></div>
      </div>
      <div class="bar ${pct>=70?'green':'amber'}"><span style="width:${pct}%"></span></div>
      <p class="small muted">Thời gian: <strong>${fmtTime(quiz.durationSec)}</strong></p>

      <h3 style="margin-top:18px">Kết quả theo Unit</h3>
      <div class="tablewrap">
        <table><thead><tr><th>Unit</th><th>Score</th><th>%</th><th>Progress</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>

      <div class="row" style="margin-top:18px">
        <button class="btn primary" data-nav="dashboard">🏠 Back to Dashboard</button>
        <button class="btn" data-quiz-restart="1">🔄 Retry practice</button>
        <button class="btn" data-practice-weak="1">🎯 Practice weak areas</button>
        <button class="btn" data-nav="mistakes">🔁 Review mistakes</button>
      </div>
    </div>

    <div class="card">
      <h2>Review Answers</h2>
      ${review}
    </div>
  `;
}

let mistakeFilter = "all";

function viewMistakes(){
  let ms = state.mistakes.slice();
  if(mistakeFilter !== "all"){
    if(mistakeFilter === "reviewed") ms = ms.filter(m => m.reviewed);
    else if(mistakeFilter === "unreviewed") ms = ms.filter(m => !m.reviewed);
    else ms = ms.filter(m => String(m.unit) === mistakeFilter);
  }

  const filterRow = `
    <div class="row" style="margin-bottom:14px">
      <button class="tab ${mistakeFilter==='all'?'active':''}" data-mfilter="all">Tất cả (${state.mistakes.length})</button>
      ${GRAMMAR_UNITS.map(u => {
        const n = state.mistakes.filter(m => m.unit === u.unit).length;
        return `<button class="tab ${mistakeFilter===String(u.unit)?'active':''}" data-mfilter="${u.unit}">Unit ${u.unit} (${n})</button>`;
      }).join("")}
      <button class="tab ${mistakeFilter==='unreviewed'?'active':''}" data-mfilter="unreviewed">Chưa xem lại</button>
      <button class="tab ${mistakeFilter==='reviewed'?'active':''}" data-mfilter="reviewed">Đã xem lại</button>

  if(!ms.length){
    return `<h1>Mistake Review</h1>
      ${filterRow}
      <div class="empty"><div class="big">🎉</div>
      <p>Không có lỗi sai nào trong mục này. Hãy làm bài tập — câu sai sẽ tự động xuất hiện ở đây.</p>
      <button class="btn primary" data-nav="practice">Đến Practice Centre</button></div>`;
  }

  const items = ms.map(m => {
    const e = findExercise(m.qid);
    if(!e) return "";
    return `<div class="list-item">
      <div class="row between">
        <div class="q">${esc(e.question)}</div>
        <span class="pill ${m.reviewed?'green':'red'}">${m.reviewed?"Đã xem lại":"Cần xem lại"}</span>
      </div>
      <div class="ansline"><span class="lbl">Bạn trả lời:</span> <span class="wrongtxt">${esc(m.userAnswer || "(trống)")}</span></div>
      <div class="ansline"><span class="lbl">Đáp án đúng:</span> <span class="righttxt">${esc(m.correctAnswer || "")}</span></div>
      <div class="ansline"><span class="lbl">Giải thích:</span> ${esc(e.explanation || "")}</div>
      <div class="ansline small muted">${esc(e.viExplanation || "")}</div>
      <div class="ansline tiny muted">Unit ${m.unit} · ${esc(m.topic || "")} · ${esc(m.type)} · Số lần sai: ${m.errors || 1}</div>
      <div class="row" style="margin-top:8px">
        <button class="btn small primary" data-retry-mistake="${esc(m.qid)}">Review / Retry</button>
        <button class="btn small" data-remove-mistake="${esc(m.qid)}">Remove mistake</button>
      </div>
    </div>`;
  }).join("");

  return `
    <div class="row between">
      <h1>Mistake Review</h1>
      <button class="btn danger small" data-clear-mistakes="1">Clear all mistakes</button>
    </div>
    <p class="muted">Mọi câu trả lời sai được lưu tự động. Xem lại và thử làm lại để khắc phục.</p>
    ${filterRow}
    ${items}
  `;
}

      <h2>Practice history</h2>
      ${state.history.length ? `<div class="tablewrap">
        <table><thead><tr><th>Thời gian</th><th>Bài</th><th>Điểm</th><th>%</th><th>Thời lượng</th></tr></thead>
        <tbody>${hist}</tbody></table></div>` : `<p class="muted">Chưa có phiên luyện tập nào.</p>`}
    </div>
  `;
}

/* =========================================================================
   18. SEARCH
   ========================================================================= */

let lastSearch = "";

function searchAll(query){
  const raw = query.trim().toLowerCase();
  if(!raw) return {topics:[], exercises:[]};
  const nq = norm(query);
  let unitFilter = null;
  const m = raw.match(/unit\s*(\d{2,3})/);
  if(m) unitFilter = Number(m[1]);

  const topics = [];
  GRAMMAR_UNITS.forEach(u => {
    if(unitFilter && u.unit !== unitFilter) return;
    u.topics.forEach(t => {
      const hay = [t.title, t.formula, t.en, t.vi, t.correct.join(" "), t.incorrect.join(" "), t.examples.join(" ")].join(" ").toLowerCase();
      if(hay.indexOf(raw) !== -1 || norm(hay).indexOf(nq) !== -1){
        topics.push({unit:u.unit, id:t.id, title:t.title, formula:t.formula, vi:t.vi});
      }
    });
  });

  const exercises = [];
  EX.forEach(e => {
    if(unitFilter && e.unit !== unitFilter) return;
    const hay = [e.question, (e.options || []).join(" "), e.answer || "", (e.acceptedAnswers || []).join(" "), e.explanation || "", e.topic || ""].join(" ").toLowerCase();
    if(hay.indexOf(raw) !== -1 || norm(hay).indexOf(nq) !== -1){
      exercises.push(e);
    }
  });

  return {topics: topics.slice(0, 40), exercises: exercises.slice(0, 40)};
}

function viewSearch(){
  const q = viewParams.q !== undefined ? viewParams.q : lastSearch;
  const res = q.trim() ? searchAll(q) : {topics:[], exercises:[]};

  let html = `<h1>Search</h1>
    <p class="muted">Tìm chủ điểm ngữ pháp, công thức, ví dụ, câu hỏi bài tập hoặc số Unit.</p>
    <div class="card">
      <input class="inputline" id="searchInput" type="search"
        placeholder="Ví dụ: enjoy + V-ing · remember doing · Unit 56 · try to do"
        value="${esc(q)}" autocomplete="off">
    </div>`;

  if(!q.trim()){
    html += `<div class="empty"><div class="big">🔍</div><p>Nhập từ khoá để bắt đầu tìm kiếm.</p></div>`;
    return html;
  }

  html += `<h3>${res.topics.length} chủ điểm · ${res.exercises.length} bài tập cho “${esc(q)}”</h3>`;

  if(res.topics.length){
    html += `<h3 style="margin-top:16px">Grammar topics</h3>`;
    html += res.topics.map(t => `
      <div class="list-item">
        <div class="row between">
          <div><strong>${esc(t.title)}</strong> <span class="pill blue">Unit ${t.unit}</span></div>
        </div>
        <div class="formula" style="margin-top:8px">${esc(t.formula)}</div>
        <div class="small muted">${esc(t.vi)}</div>
        <div class="row" style="margin-top:8px">
          <button class="btn small primary" data-open-topic="${esc(t.id)}">Mở bài học</button>
        </div>
      </div>`).join("");
  }

  if(res.exercises.length){
    html += `<h3 style="margin-top:16px">Exercises</h3>`;
    html += res.exercises.map(e => `
      <div class="list-item">
        <div class="row between">
          <div class="q">${esc(e.question)}</div>
          <span class="pill">${esc(e.type)}</span>
        </div>
        <div class="small muted" style="margin-top:6px">Unit ${e.unit} · ${esc(e.topic || "")} · ${esc(e.difficulty || "B1")}</div>
        <div class="row" style="margin-top:8px">
          <button class="btn small primary" data-practice-topic="${esc(e.topic)}">Luyện chủ điểm này</button>
        </div>
      </div>`).join("");
  }

  if(!res.topics.length && !res.exercises.length){
    html += `<div class="empty"><div class="big">🔍</div><p>Không tìm thấy kết quả cho “${esc(q)}”.</p></div>`;
  }
  return html;
}

/* =========================================================================
   19. SETTINGS
   ========================================================================= */

    <div class="card">
      <h2>Practice options</h2>
      <div class="row" style="margin-bottom:12px">
        <label style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="optShuffle" ${s.shuffle !== false ? "checked" : ""}>

        </label>

      <div class="row">
        <label style="display:flex;align-items:center;gap:8px">

function exportProgress(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "grammar-mastery-progress-" + todayKey() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Đã xuất file tiến độ.");
  }catch(e){ toast("Không thể xuất file."); }
}

function importProgress(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(String(reader.result));
      if(!data || typeof data !== "object" || Array.isArray(data)) throw new Error("bad");
      if(!data.itemStats && !data.mistakes && !data.history) throw new Error("bad");
      const base = defaultState();
      state = {
        version: APP_VERSION,
        itemStats: (data.itemStats && typeof data.itemStats === "object") ? data.itemStats : {},
        mistakes: Array.isArray(data.mistakes) ? data.mistakes : [],
        history: Array.isArray(data.history) ? data.history : [],
        studiedTopics: (data.studiedTopics && typeof data.studiedTopics === "object") ? data.studiedTopics : {},
        settings: Object.assign(base.settings, (data.settings && typeof data.settings === "object") ? data.settings : {}),
        lastUnit: typeof data.lastUnit === "number" ? data.lastUnit : 53,
        lastTopicIdx: typeof data.lastTopicIdx === "number" ? data.lastTopicIdx : 0,
        sessions: typeof data.sessions === "number" ? data.sessions : 0,
        streak: (data.streak && typeof data.streak === "object") ? data.streak : base.streak
      };
      saveState();
      toast("Đã nhập tiến độ thành công.");
      go("dashboard");
    }catch(e){
      toast("File không hợp lệ — tiến độ hiện tại được giữ nguyên.");
    }
  };
  reader.onerror = () => toast("Không đọc được file.");
  reader.readAsText(file);
}

function resetProgress(){
  if(!confirm("Are you sure you want to reset all learning progress?")) return;
  state = defaultState();
  saveState();
  toast("Đã xoá toàn bộ tiến độ.");
  go("dashboard");
}

/* =========================================================================
   20. EVENT HANDLING
   ========================================================================= */

document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-nav],[data-start-study],[data-open-topic],[data-goto-topic],[data-mark-studied],[data-study-prev],[data-study-next],[data-practice-unit],[data-practice-type],[data-practice-topic],[data-practice-mixed],[data-practice-random],[data-practice-weak],[data-practice-timed],[data-continue],[data-opt],[data-quiz-check],[data-quiz-next],[data-quiz-prev],[data-quiz-restart],[data-quit-quiz],[data-mleft],[data-mright],[data-retry-mistake],[data-remove-mistake],[data-clear-mistakes],[data-mfilter],[data-mini-opt],[data-mini-id]");
  if(!t) return;
  const d = t.dataset;

  if(d.nav){ go(d.nav); return; }

  if(d.startStudy){ go("study", {unit: Number(d.startStudy), topicIdx: 0}); return; }
  if(d.openTopic){
    let foundUnit = null, foundIdx = 0;
    GRAMMAR_UNITS.forEach(u => {
      const i = u.topics.findIndex(x => x.id === d.openTopic);
      if(i >= 0){ foundUnit = u.unit; foundIdx = i; }
    });
    if(foundUnit !== null) go("study", {unit: foundUnit, topicIdx: foundIdx});
    return;
  }
  if(d.gotoTopic){
    go("study", {unit: Number(viewParams.unit || state.lastUnit), topicIdx: Number(d.gotoTopic)});
    return;
  }
  if(d.markStudied){
    state.studiedTopics[d.markStudied] = !state.studiedTopics[d.markStudied];
    saveState(); render();
    toast(state.studiedTopics[d.markStudied] ? "Đã đánh dấu chủ điểm là đã học." : "Đã bỏ đánh dấu.");
    return;
  }
  if(d.studyPrev){
    const uid = Number(viewParams.unit || state.lastUnit);
    const u = getUnit(uid);
    const cur = Number(viewParams.topicIdx) || 0;
    if(cur > 0) go("study", {unit: uid, topicIdx: cur - 1});
    else {
      const pi = GRAMMAR_UNITS.findIndex(x => x.unit === uid);
      if(pi > 0){
        const prev = GRAMMAR_UNITS[pi-1];
        go("study", {unit: prev.unit, topicIdx: prev.topics.length - 1});
      } else toast("Đây là chủ điểm đầu tiên.");
    }
    return;
  }
  if(d.studyNext){
    const uid = Number(viewParams.unit || state.lastUnit);
    const u = getUnit(uid);
    const cur = Number(viewParams.topicIdx) || 0;
    if(cur < u.topics.length - 1) go("study", {unit: uid, topicIdx: cur + 1});
    else {
      const ni = GRAMMAR_UNITS.findIndex(x => x.unit === uid);
      if(ni < GRAMMAR_UNITS.length - 1){
        const nx = GRAMMAR_UNITS[ni+1];
        go("study", {unit: nx.unit, topicIdx: 0});
        toast("Bắt đầu Unit " + nx.unit);
      } else toast("Bạn đã hoàn thành tất cả các Unit! 🎉");
    }
    return;
  }

  if(d.practiceUnit){ startUnitPractice(Number(d.practiceUnit)); return; }
  if(d.practiceType){ startTypePractice(d.practiceType); return; }
  if(d.practiceTopic){ startTopicPractice(d.practiceTopic); return; }
  if(d.practiceMixed){ startMixed(); return; }
  if(d.practiceRandom){ startRandom(); return; }
  if(d.practiceWeak){ startWeak(); return; }
  if(d.practiceTimed){ startTimed(); return; }
  if(d.continue){
    const u = getUnit(state.lastUnit) || GRAMMAR_UNITS[0];
    go("study", {unit: u.unit, topicIdx: state.lastTopicIdx || 0});
    return;
  }

  if(d.opt !== undefined && t.classList.contains("opt")){ selectOption(d.opt); return; }
  if(d.quizCheck){ checkCurrent(); return; }
  if(d.quizNext){ nextQuestion(); return; }
  if(d.quizPrev){ prevQuestion(); return; }
  if(d.quizRestart){ restartQuiz(); return; }
  if(d.quitQuiz){
    if(confirm("Bạn có chắc muốn thoát bài luyện tập? Tiến độ bài hiện tại sẽ không được lưu.")){
      stopTimer(); quiz = null; go("practice");
    }
    return;
  }
  if(d.mleft !== undefined){ selectLeft(d.mleft); return; }
  if(d.mright !== undefined){ selectRight(d.mright); return; }

  if(d.retryMistake){ startMistakePractice(d.retryMistake); return; }
  if(d.removeMistake){ removeMistake(d.removeMistake); render(); toast("Đã xoá khỏi danh sách lỗi."); return; }
  if(d.clearMistakes){
    if(confirm("Xoá toàn bộ danh sách lỗi sai?")){
      state.mistakes = []; saveState(); render(); toast("Đã xoá tất cả lỗi sai.");
    }
    return;
  }
  if(d.mfilter){ mistakeFilter = d.mfilter; render(); return; }

  if(d.miniId && d.miniOpt){ checkMini(d.miniId, d.miniOpt); return; }
});

/* keep typed answer in state */
document.addEventListener("input", ev => {
  if(ev.target && ev.target.id === "textAnswer" && quiz){
    quiz.answers[quiz.idx] = ev.target.value;
  }
  if(ev.target && ev.target.id === "searchInput"){
    lastSearch = ev.target.value;
    const v = $("#view");
    v.innerHTML = viewSearch();
    const inp = $("#searchInput");
    if(inp){ inp.focus(); inp.setSelectionRange(lastSearch.length, lastSearch.length); }
  }
});

document.addEventListener("change", ev => {
  if(!ev.target) return;
  if(ev.target.id === "optShuffle"){
    state.settings.shuffle = ev.target.checked; saveState(); toast("Đã lưu cài đặt.");
  }
  if(ev.target.id === "optTimer"){
    let n = parseInt(ev.target.value, 10);
    if(isNaN(n) || n < 5) n = 5;
    if(n > 120) n = 120;
    state.settings.timer = n; saveState(); toast("Thời gian Timed Test: " + n + " phút.");
  }
  if(ev.target.id === "randomCount"){
    randomCount = parseInt(ev.target.value, 10) || 20;
  }
  if(ev.target.id === "importFile"){
    const f = ev.target.files && ev.target.files[0];
    if(f) importProgress(f);
    ev.target.value = "";
  }
});

document.addEventListener("click", ev => {
  if(ev.target.id === "btnExport") exportProgress();
  if(ev.target.id === "btnImport") $("#importFile").click();
  if(ev.target.id === "btnReset") resetProgress();
  if(ev.target.closest("#btnSettingsTop")) go("settings");
});

$("#globalSearch").addEventListener("keydown", ev => {
  if(ev.key === "Enter"){
    lastSearch = ev.target.value;
    go("search", {q: lastSearch});
  }
});
$("#globalSearch").addEventListener("input", ev => {
  if(currentView === "search"){
    lastSearch = ev.target.value;
    const v = $("#view");
    v.innerHTML = viewSearch();
    const inp = $("#searchInput");
    if(inp) inp.value = lastSearch;
  }
});

document.addEventListener("keydown", ev => {
  if(currentView !== "quiz" || !quiz || quiz.finished) return;
  if(ev.key === "Enter"){
    const q = quiz.instances[quiz.idx];
    const isText = ["fill","correction","transformation"].indexOf(q.type) !== -1;
    if(isText && document.activeElement && document.activeElement.id === "textAnswer"){
      ev.preventDefault();
      if(!quiz.checked[quiz.idx]) checkCurrent(); else nextQuestion();
    }
  }
});

/* =========================================================================
   21. INIT
   ========================================================================= */

function initApp(){
  loadState();
  registerSession();
  if(!getUnit(state.lastUnit)) state.lastUnit = 53;
  render();
}

initApp();
</script>
